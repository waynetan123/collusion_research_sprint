# Live smoke test through OpenRouter: DeepSeek V4 Flash 0731, pinned to DeepInfra (fp8),
# no fallback provider, DeepSeek's default sampling, reasoning off. Run:
#   python -m collusion.harness fetch-tokenizer --config configs/smoke_openrouter.toml
#   python -m collusion.harness smoke configs/smoke_openrouter.toml --rounds 40   # long-context validation (step3 §8)
# Needs OPENROUTER_API_KEY in the environment or in the repo's .env.
run_id = "di-smoke"
seeds = [1]
arms = ["arm1", "arm2"]
fix_workers = 4

[backend]
kind = "openrouter"
base_url = "https://openrouter.ai/api"
model = "deepseek/deepseek-v4-flash-0731"
provider = ["deepinfra"]        # pinned; no fallback
quantizations = ["fp8"]
tokenizer = "deepseek-v4"
concurrency = 16
max_http_retries = 10           # backoff 1,2,4,...,60 s (capped): rides out ~5 min of 429s before stopping
max_cost_usd = 0.25             # spend cap for this run_id (logged usage.cost)

[sampling]                      # DeepSeek's defaults (generation_config.json): temperature 1.0, top_p 1.0
temperature = 1.0
top_p = 1.0
top_k = 0                       # 0 / neutral values are left out of the request
enable_thinking = false
